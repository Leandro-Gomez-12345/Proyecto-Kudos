spring.application.name=UcoKudos
spring.profiles.active=${UCOKUDOS_PERFIL:dev}

logging.level.root=INFO
logging.level.co.edu.uco.kudos=INFO
logging.file.name=logs/ucokudos.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.pattern.level=%5p [%X{correlationId:-sin-id}]

spring.security.oauth2.client.registration.google.client-id=${UCOKUDOS_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${UCOKUDOS_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

ucokudos.seguridad.url-frontend=${UCOKUDOS_URL_FRONTEND:http://localhost:5173}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
